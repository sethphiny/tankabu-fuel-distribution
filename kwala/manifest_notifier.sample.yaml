# Kwala Manifest Notifier & DB Sync V2
Name: FuelFlow_Manifest_Notifier_V2
Trigger:
  TriggerSourceContract: "0xBC6724f014831D6909b6cD29aBa47301F48d72CC"
  TriggerChainID: 97
  TriggerEventName: "ManifestCreated(uint256,bytes32,uint256,uint256,address,address,address)"
  TriggerEventFilter: NA
  TriggerSourceContractABI: 
  TriggerPrice: NA
  RecurringSourceContract: NA
  RecurringChainID: 97
  RecurringEventName: "ManifestCreated(uint256,bytes32,uint256,uint256,address,address,address)"
  RecurringEventFilter: NA
  RecurringSourceContractABI: NA
  RecurringPrice: NA
  RepeatEvery: event
  ExecuteAfter: event
  ExpiresIn: 1782863999
  Meta: NA
  ActionStatusNotificationPOSTURL: NA
  ActionStatusNotificationAPIKey: NA
Actions:
  - Name: Sync_To_SQL_DB
    Type: post
    APIEndpoint: "https://tankabu-fuel-distribution.onrender.com/api/shipments"
    APIHeaders:
      x-api-key: "YOUR_BACKEND_API_KEY_HERE"
    APIPayload:
      manifest_id: re.event(0)
      product_type: re.event(1)
      volume: re.event(2)
      price: re.event(3)
      station_address: re.event(5)
      driver_address: re.event(4)
    TargetContract: NA
    TargetFunction: NA
    TargetParams: NA
    ChainID: NA
    EncodedABI: NA
    Bytecode: NA
    Metadata: NA
    RetriesUntilSuccess: 5

  - Name: Notify_Driver
    Type: post
    APIEndpoint: "https://api.telegram.org/botYOUR_TELEGRAM_BOT_TOKEN_HERE/sendMessage"
    APIPayload:
      chat_id: "YOUR_TELEGRAM_CHAT_ID_HERE"
      parse_mode: "HTML"
      text: |
        <b>🚛 New Dispatch Assignment!</b>

        <b>Manifest ID:</b> re.event(0)
        <b>Volume:</b> re.event(2) Liters
        <b>Unit Rate:</b> re.event(3) USDC
        <b>Driver:</b> re.event(4)
        <b>Target Station:</b> re.event(5)

        <i>Report to Depot immediately. Manifest authorized and synced to Hybrid DB.</i>
    TargetContract: NA
    TargetFunction: NA
    TargetParams: NA
    ChainID: NA
    EncodedABI: NA
    Bytecode: NA
    Metadata: NA
    RetriesUntilSuccess: 5
Execution:
  Mode: sequential
